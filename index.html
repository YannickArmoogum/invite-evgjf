  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        if (isPageRoot || window.parent === window) return; // authoritative miss

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

      const entry = manifest[uuid];

              const { done, value } = await reader.read();

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          return;
        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    const resourceMap = {};
    for (const entry of extResources) {

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<div style=\"display: flex; justify-content: center; gap: 22px; margin-bottom: 26px;\">\n    <div style=\"width: 10px; height: 10px; border-radius: 999px; background: #f5b942; animation: blink 1.4s infinite;\"><\u002Fdiv>\n    <div style=\"width: 10px; height: 10px; border-radius: 999px; background: #e8528f; animation: blink 1.4s .2s infinite;\"><\u002Fdiv>\n    <div style=\"width: 10px; height: 10px; border-radius: 999px; background: #58c6c6; animation: blink 1.4s .4s infinite;\"><\u002Fdiv>\n    <div style=\"width: 10px; height: 10px; border-radius: 999px; background: #f5b942; animation: blink 1.4s .6s infinite;\"><\u002Fdiv>\n    <div style=\"width: 10px; height: 10px; border-radius: 999px; background: #e8528f; animation: blink 1.4s .8s infinite;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 760px; margin: 0 auto;\">\n\n    <sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"text-align: center; animation: pop .7s ease both;\">\n        <div style=\"font-family: Karla, sans-serif; letter-spacing: .34em; text-transform: uppercase; font-size: 12px; color: #9a8fb0; margin-bottom: 18px;\">Dossier confidentiel · EVGJF<\u002Fdiv>\n        <h1 style=\"font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: clamp(38px, 9vw, 76px); line-height: .95; margin: 0 0 8px; color: #f5b942; text-shadow: 0 0 28px rgba(245,185,66,.3);\">Claire &amp; Flo<\u002Fh1>\n        <p style=\"font-size: clamp(17px, 2.6vw, 22px); color: #e7dfd2; margin: 0 auto 30px; max-width: 34ch; text-wrap: pretty;\">Une carte. Cinq étapes. Deux secrets : <em>où<\u002Fem> et <em>quoi<\u002Fem>. Personne ne vous dira rien — il faudra le mériter.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 14px; align-items: center;\">\n          <button sc-camel-on-click=\"{{ onStart }}\" style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: 20px; background: #e8528f; color: #fff; border: none; border-radius: 999px; padding: 18px 40px; cursor: pointer; animation: glow 2.6s infinite;\" style-hover=\"background: #ff6aa3; transform: translateY(-2px);\">Ouvrir la carte<\u002Fbutton>\n          <div style=\"font-size: 13px; color: #9a8fb0;\">Vous jouez à deux. Le plus rapide au buzz marque.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isGame }}\">\n      <div>\n        <div style=\"display: flex; gap: 12px; justify-content: center; margin-bottom: 26px;\">\n          <div style=\"flex: 1; max-width: 180px; background: rgba(255,255,255,.05); border: 1px solid rgba(245,185,66,.25); border-radius: 14px; padding: 12px 14px; text-align: center;\">\n            <div style=\"font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #9a8fb0;\">{{ nomA }}<\u002Fdiv>\n            <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: 28px; color: #f5b942;\">{{ scoreA }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex: 1; max-width: 180px; background: rgba(255,255,255,.05); border: 1px solid rgba(232,82,143,.3); border-radius: 14px; padding: 12px 14px; text-align: center;\">\n            <div style=\"font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #9a8fb0;\">{{ nomB }}<\u002Fdiv>\n            <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: 28px; color: #e8528f;\">{{ scoreB }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 22px;\">\n          <sc-for list=\"{{ trail }}\" as=\"stop\" hint-placeholder-count=\"5\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <div style=\"width: {{ stop.size }}; height: {{ stop.size }}; border-radius: 999px; background: {{ stop.bg }}; border: 2px solid {{ stop.border }};\"><\u002Fdiv>\n              <div style=\"width: 26px; height: 0; border-top: 2px dashed rgba(245,185,66,.35);\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"font-size: 12px; letter-spacing: .2em; color: #9a8fb0; text-transform: uppercase;\">{{ progressLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03)); border: 1px solid rgba(245,185,66,.22); border-radius: 22px; padding: clamp(22px, 4vw, 38px); animation: pop .5s ease both;\">\n          <div style=\"font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: #f5b942; margin-bottom: 10px;\">Étape {{ num }} — {{ etapeTitre }}<\u002Fdiv>\n          <h2 style=\"font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: clamp(22px, 4vw, 34px); line-height: 1.15; margin: 0 0 14px; color: #f4efe6; text-wrap: pretty;\">{{ etapeEnigme }}<\u002Fh2>\n          <div style=\"display: flex; align-items: flex-start; gap: 10px; background: rgba(245,185,66,.14); border: 1px solid rgba(245,185,66,.45); border-radius: 12px; padding: 12px 16px; margin: 0 0 24px;\"><span style=\"font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #f5b942; font-weight: 700; flex-shrink: 0; padding-top: 2px;\">Indice<\u002Fspan><p style=\"margin: 0; color: #f4efe6; font-size: 15px; font-weight: 700; text-wrap: pretty;\">{{ etapeIndice }}<\u002Fp><\u002Fdiv>\n\n          <sc-if value=\"{{ needBuzz }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <div style=\"font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: #9a8fb0; margin-bottom: 12px;\">Qui buzze ?<\u002Fdiv>\n              <div style=\"display: flex; gap: 14px; flex-wrap: wrap;\">\n                <button sc-camel-on-click=\"{{ onBuzzA }}\" style=\"flex: 1; min-width: 140px; font-family: 'Alfa Slab One', Georgia, serif; font-size: 19px; background: #f5b942; color: #221a0a; border: none; border-radius: 16px; padding: 20px; cursor: pointer;\" style-hover=\"transform: translateY(-3px);\">{{ nomA }}<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ onBuzzB }}\" style=\"flex: 1; min-width: 140px; font-family: 'Alfa Slab One', Georgia, serif; font-size: 19px; background: #e8528f; color: #fff; border: none; border-radius: 16px; padding: 20px; cursor: pointer;\" style-hover=\"transform: translateY(-3px);\">{{ nomB }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showOptions }}\">\n            <div>\n              <div style=\"font-size: 13px; color: #9a8fb0; margin-bottom: 12px;\">{{ buzzLabel }}<\u002Fdiv>\n              <div style=\"display: grid; gap: 12px;\">\n                <sc-for list=\"{{ options }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ opt.onClick }}\" disabled=\"{{ opt.locked }}\" style=\"text-align: left; font-family: Karla, sans-serif; font-size: 17px; font-weight: 700; background: {{ opt.bg }}; color: {{ opt.color }}; border: 1px solid {{ opt.border }}; border-radius: 14px; padding: 16px 18px; cursor: {{ opt.cursor }};\" style-hover=\"border-color: #f5b942;\">{{ opt.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ answered }}\">\n            <div style=\"margin-top: 24px; border-top: 1px dashed rgba(245,185,66,.3); padding-top: 20px; animation: pop .4s ease both;\">\n              <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: 20px; color: {{ verdictColor }}; margin-bottom: 8px;\">{{ verdict }}<\u002Fdiv>\n              <p style=\"margin: 0 0 18px; color: #e7dfd2; font-size: 16px; text-wrap: pretty;\">{{ etapeExplication }}<\u002Fp>\n              <div style=\"display: inline-flex; align-items: center; gap: 10px; background: rgba(88,198,198,.12); border: 1px solid rgba(88,198,198,.4); border-radius: 999px; padding: 10px 18px; margin-bottom: 20px;\">\n                <span style=\"font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #58c6c6;\">Indice<\u002Fspan>\n                <span style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: 18px; color: #f4efe6;\">{{ etapeFragment }}<\u002Fspan>\n              <\u002Fdiv>\n              <div>\n                <button sc-camel-on-click=\"{{ onNext }}\" style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: 18px; background: #f4efe6; color: #16101f; border: none; border-radius: 999px; padding: 15px 32px; cursor: pointer;\" style-hover=\"background: #fff;\">{{ nextLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;\">\n          <sc-for list=\"{{ fragments }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: 12px; letter-spacing: .06em; color: {{ f.color }}; background: rgba(255,255,255,.05); border: 1px dashed {{ f.border }}; border-radius: 10px; padding: 8px 12px;\">{{ f.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCoords }}\">\n      <div>\n        <div style=\"text-align: center; margin-bottom: 26px;\">\n          <div style=\"font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #58c6c6; margin-bottom: 10px;\">Dernier verrou<\u002Fdiv>\n          <h2 style=\"font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: clamp(26px, 5vw, 42px); line-height: 1.15; margin: 0 0 10px; color: #f5b942;\">Les coordonnées<\u002Fh2>\n          <p style=\"margin: 0 auto; max-width: 40ch; color: #b9aec9; font-size: 15px; text-wrap: pretty;\">Le lieu n'est pas écrit : il est chiffré. Deux épreuves, deux moitiés de coordonnées.<\u002Fp>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showReel }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03)); border: 1px solid rgba(245,185,66,.22); border-radius: 22px; padding: clamp(22px, 4vw, 38px);\">\n            <div style=\"font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: #f5b942; margin-bottom: 10px;\">Épreuve 1 — le stand de l'orgue<\u002Fdiv>\n            <h3 style=\"font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: clamp(19px, 3.4vw, 26px); margin: 0 0 8px; color: #f4efe6; text-wrap: pretty;\">Arrêtez le curseur pile dans la zone lumineuse pour capter la latitude.<\u002Fh3>\n            <p style=\"margin: 0 0 26px; color: #b9aec9; font-size: 15px;\">Il balaye vite. Un seul appui, pas de pitié.<\u002Fp>\n            <div style=\"position: relative; height: 62px; border-radius: 14px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.1); overflow: hidden; margin-bottom: 20px;\">\n              <div style=\"position: absolute; left: 42%; width: 16%; top: 0; bottom: 0; background: rgba(88,198,198,.22); border-left: 1px solid rgba(88,198,198,.7); border-right: 1px solid rgba(88,198,198,.7);\"><\u002Fdiv>\n              <div style=\"position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: #f5b942; box-shadow: 0 0 18px 4px rgba(245,185,66,.5); left: {{ reelLeft }};\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 16px; align-items: center; flex-wrap: wrap;\">\n              <button sc-camel-on-click=\"{{ onReelBtn }}\" style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: 20px; background: #e8528f; color: #fff; border: none; border-radius: 999px; padding: 18px 44px; cursor: pointer;\" style-hover=\"background: #ff6aa3;\">{{ spinLabel }}<\u002Fbutton>\n              <div style=\"font-size: 15px; font-weight: 700; color: {{ reelMsgColor }};\">{{ reelMsg }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showCesar }}\">\n          <div style=\"background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03)); border: 1px solid rgba(245,185,66,.22); border-radius: 22px; padding: clamp(22px, 4vw, 38px); animation: pop .5s ease both;\">\n            <div style=\"font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: #58c6c6; margin-bottom: 10px;\">Latitude captée · {{ lat }}<\u002Fdiv>\n            <div style=\"font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: #f5b942; margin-bottom: 10px;\">Épreuve 2 — le message du forain<\u002Fdiv>\n            <h3 style=\"font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: clamp(19px, 3.4vw, 26px); margin: 0 0 20px; color: #f4efe6; text-wrap: pretty;\">Un billet roulé dans un ticket de manège. Cinq lettres. Décryptez-les.<\u002Fh3>\n            <div style=\"display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px;\">\n              <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: clamp(26px, 6vw, 44px); color: #f5b942; background: rgba(0,0,0,.3); border: 1px dashed rgba(245,185,66,.5); border-radius: 12px; padding: 10px 18px; animation: float 3.4s ease-in-out infinite;\">U<\u002Fdiv>\n              <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: clamp(26px, 6vw, 44px); color: #f5b942; background: rgba(0,0,0,.3); border: 1px dashed rgba(245,185,66,.5); border-radius: 12px; padding: 10px 18px; animation: float 3.4s .2s ease-in-out infinite;\">X<\u002Fdiv>\n              <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: clamp(26px, 6vw, 44px); color: #f5b942; background: rgba(0,0,0,.3); border: 1px dashed rgba(245,185,66,.5); border-radius: 12px; padding: 10px 18px; animation: float 3.4s .4s ease-in-out infinite;\">R<\u002Fdiv>\n              <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: clamp(26px, 6vw, 44px); color: #f5b942; background: rgba(0,0,0,.3); border: 1px dashed rgba(245,185,66,.5); border-radius: 12px; padding: 10px 18px; animation: float 3.4s .6s ease-in-out infinite;\">P<\u002Fdiv>\n              <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: clamp(26px, 6vw, 44px); color: #f5b942; background: rgba(0,0,0,.3); border: 1px dashed rgba(245,185,66,.5); border-radius: 12px; padding: 10px 18px; animation: float 3.4s .8s ease-in-out infinite;\">V<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 12px; flex-wrap: wrap; align-items: center;\">\n              <input value=\"{{ cipher }}\" sc-camel-on-change=\"{{ onCipher }}\" placeholder=\"Votre réponse\" style=\"flex: 1; min-width: 200px; font-family: Karla, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; background: rgba(0,0,0,.3); color: #f4efe6; border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 16px 18px;\">\n              <button sc-camel-on-click=\"{{ onCipherSubmit }}\" style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: 18px; background: #f4efe6; color: #16101f; border: none; border-radius: 999px; padding: 16px 32px; cursor: pointer;\" style-hover=\"background: #fff;\">Valider<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"margin-top: 14px; font-size: 15px; font-weight: 700; color: {{ cipherMsgColor }};\">{{ cipherMsg }}<\u002Fdiv>\n            <div style=\"margin-top: 12px;\">\n              <sc-if value=\"{{ cipherHintShown }}\">\n                <div style=\"font-size: 14px; color: #b9aec9;\">Chaque lettre a été avancée de 3 rangs dans l'alphabet. U moins 3 donne R…<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ showCesar }}\">\n                <button sc-camel-on-click=\"{{ onCipherHint }}\" style=\"font-family: Karla, sans-serif; font-size: 13px; background: transparent; color: #9a8fb0; border: 1px solid rgba(154,143,176,.4); border-radius: 999px; padding: 10px 20px; cursor: pointer;\" style-hover=\"color: #f4efe6;\">Un indice<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showCoords }}\">\n          <div style=\"background: linear-gradient(180deg, rgba(88,198,198,.14), rgba(255,255,255,.03)); border: 1px solid rgba(88,198,198,.4); border-radius: 22px; padding: clamp(22px, 4vw, 38px); text-align: center; animation: pop .6s ease both;\">\n            <div style=\"font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #58c6c6; margin-bottom: 14px;\">Coordonnées reconstituées<\u002Fdiv>\n            <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: clamp(24px, 6vw, 46px); line-height: 1.25; color: #f4efe6;\">{{ lat }}<\u002Fdiv>\n            <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: clamp(24px, 6vw, 46px); line-height: 1.25; color: #f4efe6; margin-bottom: 20px;\">{{ lon }}<\u002Fdiv>\n            <div style=\"display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;\">\n              <a href=\"{{ mapsUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"font-family: Karla, sans-serif; font-weight: 700; font-size: 15px; text-decoration: none; color: #58c6c6; border: 1px solid rgba(88,198,198,.5); border-radius: 999px; padding: 15px 26px;\" style-hover=\"color: #f4efe6;\">Vérifier sur la carte<\u002Fa>\n              <button sc-camel-on-click=\"{{ onCoordsDone }}\" style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: 18px; background: #e8528f; color: #fff; border: none; border-radius: 999px; padding: 15px 32px; cursor: pointer;\" style-hover=\"background: #ff6aa3;\">Déclassifier le dossier<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isReveal }}\">\n      <div style=\"text-align: center;\">\n        <div style=\"width: 86px; height: 86px; margin: 0 auto 26px; border-radius: 999px; border: 5px dashed #f5b942; animation: spin 9s linear infinite;\"><\u002Fdiv>\n        <div style=\"font-size: 12px; letter-spacing: .34em; text-transform: uppercase; color: #9a8fb0; margin-bottom: 14px;\">Dossier déclassifié<\u002Fdiv>\n        <div style=\"background: linear-gradient(180deg, rgba(232,82,143,.16), rgba(255,255,255,.03)); border: 1px solid rgba(245,185,66,.3); border-radius: 26px; padding: clamp(24px, 4vw, 42px); animation: pop .7s ease both;\">\n          <div style=\"font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: #58c6c6;\">Destination<\u002Fdiv>\n          <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: clamp(44px, 12vw, 104px); line-height: 1.05; color: #f5b942; text-shadow: 0 0 34px rgba(245,185,66,.35); margin: 14px 0 4px;\">RUOMS<\u002Fdiv>\n          <div style=\"color: #b9aec9; font-size: 15px; margin-bottom: 28px;\">Ardèche · rivière, falaises et grande piscine<\u002Fdiv>\n\n          <div style=\"font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: #58c6c6;\">Thème<\u002Fdiv>\n          <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: clamp(30px, 8vw, 62px); line-height: 1.15; color: #e8528f; margin: 20px 0 6px; animation: float 4s ease-in-out infinite;\">FÊTE FORAINE<\u002Fdiv>\n          <div style=\"color: #b9aec9; font-size: 15px;\">Guirlandes, stands, buzzers et paillettes en pleine nature<\u002Fdiv>\n\n          <div style=\"height: 1px; background: rgba(245,185,66,.25); margin: 32px 0;\"><\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; text-align: left;\">\n            <div style=\"background: rgba(255,255,255,.05); border-radius: 16px; padding: 18px;\">\n              <div style=\"font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #9a8fb0; margin-bottom: 6px;\">Le jour J<\u002Fdiv>\n              <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: 22px; color: #f4efe6;\">19 septembre<\u002Fdiv>\n              <div style=\"color: #b9aec9; font-size: 14px; margin-top: 4px;\">Arrivée possible dès 15h30<\u002Fdiv><div style=\"color: #b9aec9; font-size: 14px; margin-top: 4px;\">Départ de Marseille au plus tard 19h00<\u002Fdiv><div style=\"color: #f4efe6; font-size: 14px; font-weight: 700; margin-top: 4px;\">Voiture privilégiée pour le trajet<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: rgba(255,255,255,.05); border-radius: 16px; padding: 18px;\">\n              <div style=\"font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #9a8fb0; margin-bottom: 6px;\">Dans le sac<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 6px; color: #f4efe6; font-size: 15px; font-weight: 700;\">\n                <div>Maillot de bain<\u002Fdiv>\n                <div>Les buzzers du quiz<\u002Fdiv>\n                <div>Votre micro<\u002Fdiv>\n                <div>Les alcools<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 16px; background: rgba(232,82,143,.12); border: 1px solid rgba(232,82,143,.4); border-radius: 16px; padding: 20px; text-align: left;\">\n            <div style=\"font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #9a8fb0; margin-bottom: 6px;\">Le camp de base<\u002Fdiv>\n            <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: 20px; color: #f4efe6; margin-bottom: 10px;\">La villa Airbnb, piscine comprise<\u002Fdiv>\n            <sc-if value=\"{{ hasAirbnb }}\" hint-placeholder-val=\"{{ true }}\">\n              <a href=\"{{ airbnbUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-block; font-family: Karla, sans-serif; font-weight: 700; font-size: 15px; text-decoration: none; color: #16101f; background: #f4efe6; border-radius: 999px; padding: 13px 24px;\" style-hover=\"background: #fff;\">Voir la villa<\u002Fa>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noAirbnb }}\">\n              <a href=\"https://www.airbnb.fr/rooms/23745081?source_impression_id=p3_1787037429_P3mUsTXM3Gfgakgj\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-block; font-family: monospace; font-size: 13px; color: #58c6c6; background: rgba(88,198,198,.1); border: 1px dashed rgba(88,198,198,.5); border-radius: 10px; padding: 12px; text-decoration: underline; word-break: break-all;\">https://www.airbnb.fr/rooms/23745081?source_impression_id=p3_1787037429_P3mUsTXM3Gfgakgj<\u002Fa>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ showScores }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top: 26px; background: rgba(88,198,198,.1); border: 1px solid rgba(88,198,198,.35); border-radius: 16px; padding: 18px;\">\n              <div style=\"font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #58c6c6; margin-bottom: 6px;\">Classement de la chasse<\u002Fdiv>\n              <div style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: 20px; color: #f4efe6;\">{{ winnerLine }}<\u002Fdiv>\n              <div style=\"color: #b9aec9; font-size: 14px; margin-top: 4px;\">{{ winnerSub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div>\n          <button sc-camel-on-click=\"{{ onRestart }}\" style=\"margin-top: 26px; font-family: Karla, sans-serif; font-size: 14px; background: transparent; color: #9a8fb0; border: 1px solid rgba(154,143,176,.4); border-radius: 999px; padding: 12px 24px; cursor: pointer;\" style-hover=\"color: #f4efe6; border-color: #f4efe6;\">Rejouer la chasse<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;nomA&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Claire&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;nomB&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Flo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;airbnbUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Logistique&quot;},&quot;showScores&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;revealAll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { stage: 'intro', i: 0, a: 0, b: 0, buzz: null, picked: null,\n            coordStep: 0, pos: 0.5, spinning: false, reelMsg: '', tries: 0,\n            cipher: '', cipherMsg: '', cipherHint: false };\n\n  LAT = \"44.4489° N\";\n  LON = \"4.3428° E\";\n\n  componentWillUnmount() { if (this.raf) cancelAnimationFrame(this.raf); }\n\n  tick = () => {\n    if (!this.state.spinning) return;\n    const t = performance.now() / 1000;\n    this.setState({ pos: (Math.sin(t * 3.4) + 1) / 2 });\n    this.raf = requestAnimationFrame(this.tick);\n  };\n  spin = () => { this.setState({ spinning: true, reelMsg: '' }, this.tick); };\n  stopReel = () => {\n    if (this.raf) cancelAnimationFrame(this.raf);\n    const hit = Math.abs(this.state.pos - 0.5) < 0.08;\n    this.setState(s => ({\n      spinning: false,\n      tries: s.tries + 1,\n      coordStep: hit ? 1 : 0,\n      reelMsg: hit ? \"Dans la zone. Latitude captée : \" + this.LAT\n                   : \"Trop loin du centre. L'orgue repart, relancez.\"\n    }));\n  };\n  onCipher = (ev) => this.setState({ cipher: ev.target.value, cipherMsg: '' });\n  submitCipher = () => {\n    const v = (this.state.cipher || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').trim().toUpperCase();\n    if (v === 'RUOMS') this.setState({ coordStep: 2, cipherMsg: \"Déchiffré. Longitude captée : \" + this.LON });\n    else this.setState({ cipherMsg: \"Le message résiste. Reculez chaque lettre de 3 rangs.\" });\n  };\n\n  etapes = [\n    {\n      titre: \"Le point de départ\",\n      enigme: \"Quelle rivière a creusé les falaises que l'on verra depuis le bord de la piscine ?\",\n      indice: \"Gorges, baignades, canoë. Pas besoin de passeport ni de tente.\",\n      options: [\"L'Ardèche\", \"La Dordogne\", \"Le Tarn\"],\n      bonne: \"L'Ardèche\",\n      explication: \"L'Ardèche. La villa est posée dans son dos, à l'ombre des falaises.\",\n      fragment: \"Indice : un affluent du Rhône\"\n    },\n    {\n      titre: \"Le camp de la scoute\",\n      enigme: \"Claire, un nœud pour s'encorder qui ne se resserre jamais sur le grimpeur : c'est lequel ?\",\n      indice: \"Les louveteaux l'apprennent avant de savoir allumer un feu.\",\n      options: [\"Le nœud de chaise\", \"Le nœud plat\", \"Le nœud de vache\"],\n      bonne: \"Le nœud de chaise\",\n      explication: \"Le nœud de chaise. Les vingt ans de scoutisme n'étaient pas une légende.\",\n      fragment: \"Indice : la clé chiffre de 3 rangs\"\n    },\n    {\n      titre: \"Le serveur tropical\",\n      enigme: \"Flo, avant de débugger le barbecue : quelle est la capitale de ton île ?\",\n      indice: \"Océan Indien. Rhum arrangé en production depuis des siècles.\",\n      options: [\"Port-Louis\", \"Saint-Denis\", \"Victoria\"],\n      bonne: \"Port-Louis\",\n      explication: \"Port-Louis, Maurice. Le rhum arrangé fait partie du cahier des charges du week-end.\",\n      fragment: \"Indice : longitude autour de 4° Est\"\n    },\n    {\n      titre: \"L'affaire du faux kidnapping\",\n      enigme: \"Un prénom apparaît dans le dossier de police de Claire, et c'est le sien. Lequel ?\",\n      indice: \"Deuxième prénom, mise en scène ambitieuse, garde à vue très réelle.\",\n      options: [\"Jérôme\", \"Josette\", \"Jacqueline\"],\n      bonne: \"Jérôme\",\n      explication: \"Jérôme. Le faux enlèvement reste le meilleur alibi de la famille.\",\n      fragment: \"Indice : un billet marqué UXRPV\"\n    },\n    {\n      titre: \"La grande roue\",\n      enigme: \"Le 19 septembre à 16h, quel son vous accueille au lieu du chant des cigales ?\",\n      indice: \"Guirlandes, stands, tickets. Vous apportez micro et buzzers pour une raison.\",\n      options: [\"Un orgue de Barbarie\", \"Une corne de brume\", \"Un gong de yoga\"],\n      bonne: \"Un orgue de Barbarie\",\n      explication: \"Un orgue de Barbarie : on plante une fête foraine dans le jardin de la villa.\",\n      fragment: \"Indice : latitude au-dessus de 44° Nord\"\n    }\n  ];\n\n  buzzer = (k) => this.setState({ buzz: k });\n  answer = (opt) => {\n    const e = this.etapes[this.state.i];\n    const ok = opt === e.bonne;\n    const w = ok ? this.state.buzz : (this.state.buzz === 'a' ? 'b' : 'a');\n    this.setState(s => ({ picked: opt, a: s.a + (w === 'a' ? 1 : 0), b: s.b + (w === 'b' ? 1 : 0) }));\n  };\n  next = () => {\n    if (this.state.i + 1 >= this.etapes.length) this.setState({ stage: 'coords' }, this.spin);\n    else this.setState(s => ({ i: s.i + 1, buzz: null, picked: null }));\n  };\n\n  renderVals() {\n    const p = this.props;\n    const nomA = p.nomA || \"Claire\";\n    const nomB = p.nomB || \"Flo\";\n    const { stage, i, a, b, buzz, picked } = this.state;\n    const e = this.etapes[i];\n    const answered = !!picked;\n    const ok = picked === e.bonne;\n    const last = i + 1 >= this.etapes.length;\n    const leader = a === b ? null : (a > b ? nomA : nomB);\n\n    return {\n      isIntro: stage === 'intro',\n      isGame: stage === 'game',\n      isCoords: stage === 'coords' && p.revealAll !== true,\n      isReveal: stage === 'reveal' || p.revealAll === true,\n      showReel: this.state.coordStep === 0,\n      showCesar: this.state.coordStep === 1,\n      showCoords: this.state.coordStep === 2,\n      reelLeft: (this.state.pos * 100).toFixed(2) + '%',\n      spinLabel: this.state.spinning ? \"STOP\" : \"Relancer l'orgue\",\n      onReelBtn: this.state.spinning ? this.stopReel : this.spin,\n      reelMsg: this.state.reelMsg,\n      reelMsgColor: this.state.coordStep > 0 ? '#58c6c6' : '#e8528f',\n      cipher: this.state.cipher,\n      onCipher: this.onCipher,\n      onCipherSubmit: this.submitCipher,\n      cipherMsg: this.state.cipherMsg,\n      cipherMsgColor: this.state.coordStep === 2 ? '#58c6c6' : '#e8528f',\n      cipherHintShown: this.state.cipherHint,\n      onCipherHint: () => this.setState({ cipherHint: true }),\n      lat: this.LAT, lon: this.LON,\n      mapsUrl: \"https://www.google.com/maps?q=44.4489,4.3428\",\n      onCoordsDone: () => this.setState({ stage: 'reveal' }),\n      airbnbUrl: p.airbnbUrl || '',\n      hasAirbnb: !!(p.airbnbUrl && p.airbnbUrl.length > 4),\n      noAirbnb: !(p.airbnbUrl && p.airbnbUrl.length > 4),\n      nomA, nomB, scoreA: a, scoreB: b,\n      showScores: p.showScores !== false,\n      num: i + 1,\n      etapeTitre: e.titre,\n      etapeEnigme: e.enigme,\n      etapeIndice: e.indice,\n      etapeExplication: e.explication,\n      etapeFragment: e.fragment,\n      progressLabel: (i + 1) + \" / \" + this.etapes.length,\n      trail: this.etapes.map((_, n) => ({\n        size: n === i ? '16px' : '11px',\n        bg: n < i ? '#58c6c6' : (n === i ? '#f5b942' : 'transparent'),\n        border: n <= i ? 'transparent' : 'rgba(245,185,66,.4)'\n      })),\n      fragments: this.etapes.map((x, n) => ({\n        label: n < i || (n === i && answered) ? x.fragment : \"indice scellé\",\n        color: n < i || (n === i && answered) ? '#f4efe6' : '#5d5470',\n        border: n < i || (n === i && answered) ? 'rgba(88,198,198,.4)' : 'rgba(255,255,255,.12)'\n      })),\n      needBuzz: !buzz,\n      showOptions: !!buzz,\n      buzzLabel: buzz ? ((buzz === 'a' ? nomA : nomB) + \" a buzzé. Réponse ?\") : \"\",\n      onBuzzA: () => this.buzzer('a'),\n      onBuzzB: () => this.buzzer('b'),\n      options: e.options.map(o => ({\n        label: o,\n        onClick: answered ? (() => {}) : (() => this.answer(o)),\n        locked: answered,\n        cursor: answered ? 'default' : 'pointer',\n        bg: !answered ? 'rgba(255,255,255,.05)' : (o === e.bonne ? 'rgba(88,198,198,.18)' : (o === picked ? 'rgba(232,82,143,.16)' : 'rgba(255,255,255,.03)')),\n        color: !answered ? '#f4efe6' : (o === e.bonne || o === picked ? '#f4efe6' : '#6d6480'),\n        border: !answered ? 'rgba(255,255,255,.14)' : (o === e.bonne ? 'rgba(88,198,198,.6)' : (o === picked ? 'rgba(232,82,143,.6)' : 'rgba(255,255,255,.08)'))\n      })),\n      answered,\n      verdict: ok ? \"Point pour \" + (buzz === 'a' ? nomA : nomB) + \" !\" : \"Raté — le point part chez \" + (buzz === 'a' ? nomB : nomA),\n      verdictColor: ok ? '#58c6c6' : '#e8528f',\n      nextLabel: last ? \"Passer au décryptage des coordonnées\" : \"Étape suivante\",\n      onNext: this.next,\n      onStart: () => this.setState({ stage: 'game' }),\n      onRestart: () => this.setState({ stage: 'intro', i: 0, a: 0, b: 0, buzz: null, picked: null, coordStep: 0, spinning: false, reelMsg: '', cipher: '', cipherMsg: '', cipherHint: false }),\n      winnerLine: leader ? leader + \" mène \" + Math.max(a, b) + \" – \" + Math.min(a, b) : \"Égalité parfaite : \" + a + \" – \" + b,\n      winnerSub: leader ? \"La revanche se jouera au buzzer, sur place.\" : \"Il faudra bien départager ça à Ruoms.\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
